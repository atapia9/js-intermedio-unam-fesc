<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Actividad 4 — Lista de tareas</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 2rem auto; }
    form { display: grid; gap: .5rem; margin-bottom: 1rem; }
    #errores { color: #b00020; padding-left: 1.2rem; }
    #lista-tareas li { display: flex; gap: .5rem; align-items: center; padding: .3rem 0; }
    #lista-tareas li span { flex: 1; cursor: pointer; }
    #lista-tareas li.completada span { text-decoration: line-through; color: gray; }
  </style>
</head>
<body>
  <h1>Mis tareas</h1>

  <!-- novalidate: la validación la hace TU JavaScript y los errores se muestran en #errores -->
  <form id="form-tarea" novalidate>
    <input name="titulo" placeholder="Título de la tarea" />
    <select name="categoria">
      <option value="">Elige una categoría…</option>
      <option value="trabajo">Trabajo</option>
      <option value="estudio">Estudio</option>
      <option value="personal">Personal</option>
    </select>
    <button type="submit">Agregar</button>
  </form>

  <ul id="errores" role="alert"></ul>

  <ul id="lista-tareas"></ul>

  <button id="btn-limpiar" type="button">Limpiar todas</button>

  <!-- Script clásico (sin type="module"): así lo puede ejecutar el verificador. -->
  <script src="app.js" defer></script>
</body>
</html>
