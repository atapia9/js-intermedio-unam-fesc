    Enunciado:
    Completa la función generarLista(cantidad) para que cree `cantidad`
    elementos <li> con texto "Tarea N" usando un DocumentFragment, y los
    inserte todos de una sola vez en #lista. Usa performance.now() para
    medir cuánto tarda con 5000 elementos.
  -->
  <button id="generar">Generar 5000 tareas</button>
  <p id="tiempo"></p>
  <ul id="lista"></ul>

  <script>
    function generarLista(cantidad) {
      const lista = document.querySelector('#lista');
      lista.innerHTML = '';
      // TODO: usa un DocumentFragment
    }

    document.querySelector('#generar').addEventListener('click', () => {
      const inicio = performance.now();
      generarLista(5000);
      document.querySelector('#tiempo').textContent =
        `Tiempo: ${(performance.now() - inicio).toFixed(2)}ms`;
    });
