<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Día 4 — Formularios y FormData</title>
</head>
<body>
  <h1>Validación avanzada y FormData</h1>
  <form id="inscripcion">
    <input name="nombre" placeholder="Nombre completo" required />
    <input name="correo" type="email" placeholder="Correo" required />
    <input name="edad" type="number" placeholder="Edad" />
    <input name="foto" type="file" />
    <button type="submit">Inscribirme</button>
  </form>
  <pre id="salida"></pre>

  <script>
    const form = document.querySelector('#inscripcion');
    const salida = document.querySelector('#salida');

    form.addEventListener('submit', (evento) => {
      evento.preventDefault(); // evita el envío/recarga tradicional del navegador

      // Validación nativa (required, type="email") ya corrió automáticamente
      // gracias a checkValidity(); agregamos validación programática extra:
      const edad = Number(form.edad.value);
      if (form.edad.value && (edad < 0 || edad > 120)) {
        salida.textContent = 'Error: edad fuera de rango razonable.';
        return;
      }

      // FormData recolecta TODOS los valores del formulario de una vez,
      // incluyendo archivos adjuntos, sin tener que leer cada input manualmente.
      const datos = new FormData(form);
      const resumen = {};
      for (const [clave, valor] of datos.entries()) {
        resumen[clave] = valor instanceof File ? `Archivo: ${valor.name}` : valor;
      }
      salida.textContent = 'Inscripción registrada:\n' + JSON.stringify(resumen, null, 2);
    });
  </script>
</body>
</html>
