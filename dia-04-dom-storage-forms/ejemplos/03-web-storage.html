<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Día 4 — Web Storage</title>
</head>
<body>
  <h1>localStorage vs sessionStorage</h1>
  <input id="nombre" placeholder="Escribe tu nombre" />
  <button id="guardar-local">Guardar en localStorage</button>
  <button id="guardar-sesion">Guardar en sessionStorage</button>
  <button id="limpiar">Limpiar ambos</button>
  <pre id="salida"></pre>

  <script>
    const input = document.querySelector('#nombre');
    const salida = document.querySelector('#salida');

    function mostrarEstado() {
      salida.textContent =
        'localStorage.nombre = ' + JSON.stringify(localStorage.getItem('nombre')) + '\n' +
        'sessionStorage.nombre = ' + JSON.stringify(sessionStorage.getItem('nombre'));
    }

    document.querySelector('#guardar-local').addEventListener('click', () => {
      localStorage.setItem('nombre', input.value); // persiste aunque cierres el navegador
      mostrarEstado();
    });

    document.querySelector('#guardar-sesion').addEventListener('click', () => {
      sessionStorage.setItem('nombre', input.value); // se pierde al cerrar la pestaña
      mostrarEstado();
    });

    document.querySelector('#limpiar').addEventListener('click', () => {
      localStorage.removeItem('nombre');
      sessionStorage.removeItem('nombre');
      mostrarEstado();
    });

    // Ambos storages solo guardan strings: para objetos/arreglos hay que serializar.
    const preferencias = { tema: 'oscuro', idioma: 'es' };
    localStorage.setItem('preferencias', JSON.stringify(preferencias));
    const leidas = JSON.parse(localStorage.getItem('preferencias'));
    console.log('Preferencias leídas:', leidas);

    mostrarEstado();
  </script>
</body>
</html>
