<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>BIS — Bitácora de Incidentes de Soporte</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; }
  li { display: flex; justify-content: space-between; align-items: center; gap: .5rem; padding: .5rem 0; border-bottom: 1px solid #eee; }
  li span[data-accion] { flex: 1; }
  .puntaje { font-size: .85rem; color: #555; }
  .estado-cerrado, .estado-falso-positivo { opacity: .6; text-decoration: line-through; }
  form { display: grid; gap: .5rem; margin-bottom: 1.5rem; }
</style>
</head>
<body>
  <h1>BIS — Bitácora de Incidentes de Soporte</h1>
  <p>Proyecto integrador — JavaScript Intermedio (UNAM · FES Cuautitlán · REDEC)</p>

  <form id="form-nuevo-registro">
    <select name="categoria" required>
      <option value="phishing">Phishing</option>
      <option value="malware">Malware</option>
      <option value="acceso-sospechoso">Acceso sospechoso</option>
      <option value="equipo-extraviado">Equipo extraviado</option>
      <option value="otro">Otro</option>
    </select>
    <input name="descripcion" placeholder="Descripción del incidente..." required />
    <input name="reportantePseudonimo" placeholder="Pseudónimo del reportante" required />
    <label>Impacto (1-3) <input name="impacto" type="number" min="1" max="3" value="1" /></label>
    <label>Urgencia (1-3) <input name="urgencia" type="number" min="1" max="3" value="1" /></label>
    <button type="submit">Registrar incidente</button>
  </form>

  <ul id="lista-registros"></ul>

  <script type="module" src="src/main.js"></script>
</body>
</html>
