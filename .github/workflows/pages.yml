# Nota de divulgación: Este material fue elaborado con asistencia de Claude (Anthropic) y revisado por Jesús Armando Tapia Gallegos.
#
# Publica proyecto-integrador/ (la app BIS) en GitHub Pages usando módulos ESM nativos,
# sin build. También se puede lanzar a mano desde la pestaña Actions.
#
# Paso único antes del primer despliegue: activa Pages en Settings → Pages →
# "Build and deployment" → Source → "GitHub Actions". configure-pages NO lo hace
# por sí solo (su input `enablement` es false por defecto y, aun activado, exige
# un token distinto al GITHUB_TOKEN con permiso de administración del repo). Ese
# paso es de una sola vez: una vez activado, cada push despliega solo.

name: Publicar proyecto integrador en Pages

on:
  push:
    branches: [main]
    paths:
      - 'proyecto-integrador/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: proyecto-integrador
      - uses: actions/deploy-pages@v4
        id: deployment
